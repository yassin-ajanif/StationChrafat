<div class="configuration-step1 mx-auto max-w-4xl">
  <header class="configuration-step1__header mb-8 flex items-center gap-3">
    <span
      class="configuration-step1__icon flex size-10 items-center justify-center rounded bg-primary/10 text-primary"
      aria-hidden="true"
    >⚙</span>
    <h1 class="font-display text-2xl font-bold uppercase">Étape 1 : Configuration du shift</h1>
  </header>

  <div
    class="configuration-step1__card space-y-8 rounded-[var(--radius-card)] border-t-4 border-primary bg-surface-container-lowest p-8 shadow-sm"
  >
    <div class="grid gap-6 md:grid-cols-2">
      <div>
        <label class="configuration-step1__label" for="chef-de-piste">Chef de piste (opérateur)</label>
        <select
          id="chef-de-piste"
          class="configuration-step1__select"
          [value]="chefId() ?? ''"
          (change)="onChefChange($event)"
          [disabled]="operatorsLoading()"
        >
          <option value="">Sélectionner le chef de piste…</option>
          @for (op of operators(); track op.id) {
            <option [value]="op.id">{{ op.name }}</option>
          }
        </select>
        <p class="configuration-step1__hint">Responsable de la clôture de ce shift.</p>
      </div>

      <div>
        <label class="configuration-step1__label" for="bombiste">Bombiste</label>
        <select
          id="bombiste"
          class="configuration-step1__select"
          [value]="bombisteId() ?? ''"
          (change)="onBombisteChange($event)"
          [disabled]="operatorsLoading()"
        >
          <option value="">Sélectionner le bombiste…</option>
          @for (op of operators(); track op.id) {
            <option [value]="op.id">{{ op.name }}</option>
          }
        </select>
        <p class="configuration-step1__hint">Pompiste sur pistolets pour ce shift.</p>
      </div>
    </div>

    <div>
      <label class="configuration-step1__label">Heure d'ouverture système</label>
      <div class="configuration-step1__readonly">
        <span aria-hidden="true">🕐</span>
        {{ openedAt() | date: 'HH:mm:ss' }}
      </div>
    </div>

    <div>
      <p class="configuration-step1__label mb-3">Plage horaire (shift)</p>
      <app-shift-slot-picker [selected]="shiftSlot()" (selectedChange)="onSlotChange($event)" />
    </div>

    @if (startError(); as err) {
      <p class="text-sm text-primary" role="alert">{{ err }}</p>
    }
  </div>

  <footer class="configuration-step1__footer mt-8 flex flex-wrap justify-between gap-4">
    <a routerLink="/journees">
      <app-button variant="secondary">Annuler</app-button>
    </a>
    <app-button
      variant="primary"
      [disabled]="!canStart()"
      [loading]="startingJournee()"
      (pressed)="start()"
    >
      Démarrer la journée →
    </app-button>
  </footer>
</div>
