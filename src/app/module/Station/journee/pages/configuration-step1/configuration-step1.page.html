<div class="configuration-step1 mx-auto max-w-4xl">
  <header class="configuration-step1__header mb-8 flex items-center gap-3">
    <span
      class="configuration-step1__icon flex size-10 items-center justify-center rounded bg-primary/10 text-primary"
      aria-hidden="true"
    >⚙</span>
    <h1 class="font-display text-2xl font-bold uppercase">{{ 'journee.step1.title' | translate }}</h1>
  </header>

  <div
    class="configuration-step1__card space-y-8 rounded-[var(--radius-card)] border-t-4 border-primary bg-surface-container-lowest p-8 shadow-sm"
  >
    <div class="grid gap-6 md:grid-cols-1">
      <div>
        <label class="configuration-step1__label" for="chef-de-piste">{{ 'journee.step1.chefLabel' | translate }}</label>
        <select
          id="chef-de-piste"
          class="configuration-step1__select"
          (change)="onChefChange($event)"
          [disabled]="operatorsLoading() && operators().length === 0"
        >
          <option value="" [selected]="chefId() == null">{{ 'journee.step1.chefPlaceholder' | translate }}</option>
          @for (op of operators(); track op.id) {
            <option [value]="op.id" [selected]="chefId() === op.id">{{ op.name }}</option>
          }
        </select>
        <p class="configuration-step1__hint">{{ 'journee.step1.chefHint' | translate }}</p>
      </div>
    </div>

    <div>
      <label class="configuration-step1__label">{{ 'journee.step1.openedAt' | translate }}</label>
      <div class="configuration-step1__readonly">
        <span aria-hidden="true">🕐</span>
        {{ openedAt() | date: 'HH:mm:ss' }}
      </div>
    </div>

    <div>
      <p class="configuration-step1__label mb-3">{{ 'journee.step1.shiftSlot' | translate }}</p>
      <app-shift-slot-picker [selected]="shiftSlot()" (selectedChange)="onSlotChange($event)" />
    </div>

    @if (startError(); as err) {
      <p class="text-sm text-primary" role="alert">{{ err }}</p>
    }
  </div>

  <footer class="configuration-step1__footer mt-8 flex flex-wrap items-center gap-4">
    <a routerLink="/journees">
      <app-button variant="secondary">{{ 'common.actions.cancel' | translate }}</app-button>
    </a>
    <app-wizard-step-errors [errors]="stepValidationErrors()" />
    <app-button
      variant="primary"
      class="ml-auto"
      [disabled]="!canStart()"
      [loading]="startingJournee()"
      (pressed)="start()"
    >
      {{ 'journee.step1.start' | translate }}
    </app-button>
  </footer>
</div>
