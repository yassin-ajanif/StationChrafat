<div class="journee-wizard">
  @if (currentPath() !== 'validation-step6') {
    <div class="journee-wizard__intro mb-6">
      <p class="font-display text-xs font-semibold uppercase tracking-wider text-on-surface-variant">
        Journée › Ouverture de journée
      </p>
      <h1 class="font-display text-2xl font-bold uppercase text-on-surface">Ouverture de journée</h1>
    </div>
  }
  <app-wizard-stepper
    [steps]="steps"
    [currentPath]="currentPath()"
    [compact]="currentPath() === 'validation-step6'"
  />
  <div
    class="journee-wizard__outlet"
    [class.journee-wizard__outlet--validation]="currentPath() === 'validation-step6'"
  >
    <router-outlet />
  </div>
</div>
