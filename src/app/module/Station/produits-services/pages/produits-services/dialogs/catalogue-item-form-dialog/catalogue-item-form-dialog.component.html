@if (open()) {
  <div
    class="catalogue-item-form-dialog__backdrop fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/50 p-4"
    data-dialog-backdrop="true"
    role="presentation"
    (click)="onBackdropClick($event)"
  >
    <div
      class="catalogue-item-form-dialog__panel w-full max-w-2xl rounded-[var(--radius-card)] bg-surface-container-lowest shadow-lg"
      role="dialog"
      aria-modal="true"
      aria-labelledby="catalogue-item-form-dialog-title"
      (click)="$event.stopPropagation()"
    >
      <header class="catalogue-item-form-dialog__header flex items-start gap-4 border-b border-outline-variant px-6 py-5">
        <span class="catalogue-item-form-dialog__icon" aria-hidden="true">+</span>
        <div class="min-w-0 flex-1">
          <h2 id="catalogue-item-form-dialog-title" class="catalogue-item-form-dialog__title font-display uppercase text-on-surface">
            @if (isEditMode()) {
              Modifier l'article
            } @else {
              Ajouter un article
            }
          </h2>
          <p class="catalogue-item-form-dialog__subtitle mt-1 text-sm text-on-surface-variant">
            Enregistrer un nouveau produit ou service dans votre catalogue de vente.
          </p>
        </div>
        <button
          type="button"
          class="text-2xl leading-none text-on-surface-variant hover:text-on-surface"
          aria-label="Fermer"
          (click)="cancel()"
        >
          ×
        </button>
      </header>

      <div class="px-6 py-5">
        <div class="catalogue-item-form-dialog__grid grid gap-4 sm:grid-cols-2">
          <label class="catalogue-item-form-dialog__field">
            <span class="catalogue-item-form-dialog__label">Nom de l'article</span>
            <input
              type="text"
              class="catalogue-item-form-dialog__input"
              placeholder="Ex: Gazole Excellium"
              [value]="name()"
              (input)="name.set($any($event.target).value)"
            />
          </label>

          <label class="catalogue-item-form-dialog__field">
            <span class="catalogue-item-form-dialog__label">Type</span>
            <select class="catalogue-item-form-dialog__input" [value]="type()" (change)="onTypeChange($event)">
              <option value="produit">Produit</option>
              <option value="service">Service</option>
            </select>
          </label>

          <label class="catalogue-item-form-dialog__field">
            <span class="catalogue-item-form-dialog__label">Catégorie</span>
            <select
              class="catalogue-item-form-dialog__input"
              [value]="categoryId()"
              (change)="categoryId.set(+$any($event.target).value)"
            >
              <option [value]="0">Sélectionner…</option>
              @for (cat of categoriesForType(); track cat.id) {
                <option [value]="cat.id">{{ cat.label }}</option>
              }
            </select>
          </label>

          <label class="catalogue-item-form-dialog__field">
            <span class="catalogue-item-form-dialog__label">Prix unitaire (TTC)</span>
            <span class="catalogue-item-form-dialog__price-wrap flex">
              <input
                type="number"
                class="catalogue-item-form-dialog__input catalogue-item-form-dialog__input--price min-w-0 flex-1"
                placeholder="0.00"
                min="0"
                step="0.01"
                inputmode="decimal"
                [value]="unitPrice() || ''"
                (input)="unitPrice.set(+$any($event.target).value || 0)"
              />
              <span class="catalogue-item-form-dialog__currency">MAD</span>
            </span>
          </label>
        </div>
      </div>

      <footer class="flex justify-end gap-3 border-t border-outline-variant px-6 py-4">
        <app-button variant="secondary" (pressed)="cancel()">Annuler</app-button>
        <app-button variant="primary" [disabled]="!isValid() || saving()" [loading]="saving()" (pressed)="save()">
          @if (isEditMode()) {
            Enregistrer les modifications
          } @else {
            Enregistrer l'article
          }
        </app-button>
      </footer>
    </div>
  </div>
}
