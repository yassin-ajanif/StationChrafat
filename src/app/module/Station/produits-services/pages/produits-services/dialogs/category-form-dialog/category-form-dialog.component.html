@if (open()) {
  <div
    class="category-form-dialog__backdrop fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/50 p-4"
    data-dialog-backdrop="true"
    role="presentation"
    (click)="onBackdropClick($event)"
  >
    <div
      class="category-form-dialog__panel w-full max-w-md rounded-[var(--radius-card)] bg-surface-container-lowest shadow-lg"
      role="dialog"
      aria-modal="true"
      aria-labelledby="category-form-dialog-title"
      (click)="$event.stopPropagation()"
    >
      <header class="flex items-start justify-between border-b border-outline-variant px-6 py-4">
        <div>
          <h2 id="category-form-dialog-title" class="font-display text-xl font-bold uppercase text-on-surface">
            @if (isEditMode()) {
              Modifier la catégorie
            } @else {
              Nouvelle catégorie
            }
          </h2>
          <p class="mt-1 text-sm text-on-surface-variant">
            @if (kind() === 'service') {
              Catégorie de services (lavage, vidange…)
            } @else {
              Catégorie de produits (carburant, boutique…)
            }
          </p>
        </div>
        <button
          type="button"
          class="text-2xl leading-none text-on-surface-variant hover:text-on-surface"
          aria-label="Fermer"
          (click)="cancel()"
        >
          ×
        </button>
      </header>

      <div class="px-6 py-5">
        <label class="category-form-dialog__field block">
          <span class="category-form-dialog__label">Type</span>
          <select
            class="category-form-dialog__input w-full"
            [value]="kind()"
            [disabled]="isEditMode()"
            (change)="kind.set($any($event.target).value)"
          >
            <option value="service">Service</option>
            <option value="product">Produit</option>
          </select>
        </label>

        <label class="category-form-dialog__field mt-4 block">
          <span class="category-form-dialog__label">Nom de la catégorie</span>
          <input
            type="text"
            class="category-form-dialog__input w-full"
            placeholder="Ex: Nettoyage"
            [value]="label()"
            (input)="label.set($any($event.target).value)"
          />
        </label>
      </div>

      <footer class="flex justify-end gap-3 border-t border-outline-variant px-6 py-4">
        <app-button variant="secondary" (pressed)="cancel()">Annuler</app-button>
        <app-button variant="primary" [disabled]="!isValid() || saving()" [loading]="saving()" (pressed)="save()">
          @if (isEditMode()) {
            Enregistrer
          } @else {
            Créer la catégorie
          }
        </app-button>
      </footer>
    </div>
  </div>
}
