<div class="stock-gestion-kpi-cards grid gap-4 sm:grid-cols-2 xl:grid-cols-4" [attr.aria-label]="'stock.gestion.kpiAria' | translate">
  @for (card of summaries(); track card.id) {
    <article
      class="stock-gestion-kpi-cards__card relative overflow-hidden rounded-[var(--radius-card)] border border-outline-variant/80 bg-surface-container-lowest p-4 shadow-sm"
      [class]="'stock-gestion-kpi-cards__card--' + (card.accent ?? 'default')"
    >
      <p class="font-display text-xs font-bold uppercase tracking-wide text-on-surface-variant">
        {{ summaryLabelKey(card.accent) | translate }}
      </p>
      <p class="stock-gestion-kpi-cards__value mt-2 font-display text-3xl font-bold tabular-nums">
        {{ card.valueDh | localeCurrency }}
      </p>
      <p class="mt-1 text-sm font-semibold text-success">
        {{ 'stock.gestion.trend' | translate: { percent: card.trendPercent } }}
      </p>
    </article>
  }
</div>
