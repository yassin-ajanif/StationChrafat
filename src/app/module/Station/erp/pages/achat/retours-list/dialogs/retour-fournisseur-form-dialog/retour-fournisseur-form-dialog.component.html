@if (open()) {
  <div
    class="retour-fournisseur-form-dialog__backdrop fixed inset-0 z-50 flex items-center justify-center bg-inverse-surface/50 p-4"
    data-dialog-backdrop="true"
    role="presentation"
    (click)="onBackdropClick($event)"
  >
    <div
      class="retour-fournisseur-form-dialog__panel w-full max-w-6xl rounded-[var(--radius-card)] bg-surface-container-lowest shadow-lg"
      role="dialog"
      aria-modal="true"
      aria-labelledby="retour-fournisseur-form-dialog-title"
      (click)="$event.stopPropagation()"
    >
      <header class="flex items-start justify-between border-b border-outline-variant px-6 py-4">
        <div>
          <h2 id="retour-fournisseur-form-dialog-title" class="font-display text-xl font-bold uppercase text-on-surface">
            @if (isEditMode()) {
              Modifier bon de retour
            } @else {
              Nouveau bon de retour
            }
          </h2>
          <p class="mt-1 text-sm text-on-surface-variant">
            Remplissez les tableaux services et produits.
          </p>
        </div>
        <button
          type="button"
          class="text-2xl leading-none text-on-surface-variant hover:text-on-surface"
          aria-label="Fermer"
          (click)="cancel()"
        >
          ×
        </button>
      </header>

      <div class="max-h-[70vh] overflow-y-auto px-6 py-5">
        <div class="mb-6 grid gap-4 sm:grid-cols-2">
          <div>
            <label class="retour-fournisseur-form-dialog__label" for="dialog-retour-fournisseur">Fournisseur</label>
            <input
              id="dialog-retour-fournisseur"
              type="text"
              class="retour-fournisseur-form-dialog__input"
              placeholder="Nom du fournisseur"
              [value]="fournisseur()"
              (input)="fournisseur.set($any($event.target).value)"
            />
          </div>
          <div>
            <label class="retour-fournisseur-form-dialog__label" for="dialog-retour-fournisseur-facture">Facture liée</label>
            <input
              id="dialog-retour-fournisseur-facture"
              type="text"
              class="retour-fournisseur-form-dialog__input"
              placeholder="FF-S-0001"
              [value]="factureLiee()"
              (input)="factureLiee.set($any($event.target).value)"
            />
          </div>
          <div>
            <label class="retour-fournisseur-form-dialog__label" for="dialog-retour-fournisseur-statut">Statut</label>
            <select
              id="dialog-retour-fournisseur-statut"
              class="retour-fournisseur-form-dialog__input"
              [value]="statut()"
              (change)="statut.set($any($event.target).value)"
            >
              @for (s of statutOptions; track s) {
                <option [value]="s">{{ statutLabels[s] }}</option>
              }
            </select>
          </div>
          <div>
            <label class="retour-fournisseur-form-dialog__label" for="dialog-retour-fournisseur-date">Date création</label>
            <input
              id="dialog-retour-fournisseur-date"
              type="date"
              class="retour-fournisseur-form-dialog__input"
              [value]="dateCreation()"
              (input)="dateCreation.set($any($event.target).value)"
            />
          </div>
          <div class="sm:col-span-2">
            <label class="retour-fournisseur-form-dialog__label" for="dialog-retour-fournisseur-motif">Motif du retour</label>
            <textarea
              id="dialog-retour-fournisseur-motif"
              class="retour-fournisseur-form-dialog__input"
              placeholder="Raison du retour"
              [value]="motif()"
              (input)="motif.set($any($event.target).value)"
              rows="2"
            ></textarea>
          </div>
        </div>

        <section class="mb-8">
          <app-document-lines-table
            title="Produits retournés"
            addRowLabel="+ Ajouter une ligne produit"
            [rows]="serviceRows()"
            (rowChange)="onServiceRowChange($event)"
            (addRowRequested)="addServiceRow()"
            (clearRowRequested)="clearServiceRow($event)"
          />
        </section>

        <section class="mb-8">
          <app-document-lines-table
            title="Produits consommés"
            addRowLabel="+ Ajouter une ligne produit"
            [rows]="productRows()"
            (rowChange)="onProductRowChange($event)"
            (addRowRequested)="addProductRow()"
            (clearRowRequested)="clearProductRow($event)"
          />
        </section>

        <app-bon-recap-payments
          inputIdPrefix="retour-fournisseur"
          [serviceTotal]="serviceTotal()"
          [productTotal]="productTotal()"
          [bonTotal]="retourTotal()"
          [payments]="payments()"
          (paymentsChange)="payments.set($event)"
        />
      </div>

      <footer class="flex flex-wrap items-center justify-between gap-4 border-t border-outline-variant px-6 py-4">
        <p class="text-sm text-on-surface-variant">
          Montant retour =
          <span class="font-bold tabular-nums text-on-surface">{{ retourTotal() | number: '1.2-2' }} DH</span>
        </p>
        <app-button variant="secondary" (pressed)="cancel()">Annuler</app-button>
        <app-button variant="primary" [disabled]="!canSave()" (pressed)="save()">
          @if (isEditMode()) {
            Enregistrer les modifications
          } @else {
            Enregistrer le retour
          }
        </app-button>
      </footer>
    </div>
  </div>
}
