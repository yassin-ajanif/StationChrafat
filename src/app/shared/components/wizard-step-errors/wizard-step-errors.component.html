@if (errors().length > 0) {
  <div
    class="wizard-step-errors flex min-w-0 flex-1 items-center justify-center px-4"
    role="alert"
    aria-live="polite"
  >
    <ul class="wizard-step-errors__list text-center text-sm text-primary">
      @for (error of errors(); track $index) {
        <li class="wizard-step-errors__item">
          {{ error.key | translate: error.params }}
        </li>
      }
    </ul>
  </div>
}
