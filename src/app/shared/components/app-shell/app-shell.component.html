<div class="app-shell flex min-h-dvh bg-surface">
  <aside class="app-shell__sidebar flex w-[var(--width-sidebar)] shrink-0 flex-col bg-inverse-surface text-inverse-on-surface">
    <div class="app-shell__brand border-b border-white/10 px-4 py-5">
      <p class="font-display text-xl font-bold uppercase tracking-wide text-primary-container">
        CHARAFATE
      </p>
      <p class="text-sm text-inverse-on-surface/70">Management Portal</p>
    </div>
    <nav class="flex flex-1 flex-col gap-1 p-2">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="app-shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.route === '/journees' }"
          class="app-shell__nav-link min-h-[var(--spacing-touch)] rounded-r-[var(--radius-card)] px-3 py-3 font-display text-sm font-semibold uppercase tracking-wide text-inverse-on-surface/80 hover:bg-white/5"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>
  <div class="app-shell__main flex min-w-0 flex-1 flex-col">
    <header class="app-shell__header flex min-h-16 items-center justify-between border-b border-outline-variant bg-surface-container-lowest px-6">
      <p class="font-display text-sm font-bold uppercase text-on-surface-variant">
        Station CHARAFATE
      </p>
      <div class="flex items-center gap-4 text-sm text-on-surface-variant">
        <span class="hidden md:inline">Admin Station</span>
        <span class="app-shell__avatar flex size-9 items-center justify-center rounded-full bg-primary text-xs font-bold text-on-primary">AB</span>
      </div>
    </header>
    <main class="app-shell__content flex-1 overflow-auto p-6 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
