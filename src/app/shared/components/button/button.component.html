<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  (click)="pressed.emit()"
  class="app-button inline-flex min-h-[var(--spacing-touch)] items-center justify-center gap-2 px-6 font-display text-sm font-bold uppercase tracking-wide transition disabled:cursor-not-allowed disabled:opacity-50"
  [ngClass]="variantClasses()"
>
  @if (loading()) {
    <span class="app-button__spinner size-4 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
  }
  <ng-content />
</button>
