<nav
  class="wizard-stepper w-full pb-6"
  [class.wizard-stepper--compact]="compact()"
  [attr.aria-label]="'journee.wizard.title' | translate"
>
  <div class="wizard-stepper__track mx-auto max-w-5xl">
    @for (step of steps(); track step.id) {
      <a
        [routerLink]="['/journees', 'nouvelle', step.path]"
        class="wizard-stepper__link"
        [class.wizard-stepper__link--active]="isActive(step)"
        [class.wizard-stepper__link--completed]="isCompleted(step) && isStepValid(step)"
        [class.wizard-stepper__link--invalid]="showInvalidMark(step)"
      >
        <span class="wizard-stepper__badge">
          @if (showCheckmark(step)) {
            <span aria-hidden="true">✓</span>
          } @else if (showInvalidMark(step)) {
            <span class="wizard-stepper__invalid-mark" aria-hidden="true">✕</span>
          } @else {
            {{ formatOrder(step) }}
          }
        </span>
        @if (!compact()) {
          <span class="wizard-stepper__label">{{ step.labelKey | translate }}</span>
        }
      </a>
    }
  </div>
</nav>
